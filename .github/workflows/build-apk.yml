name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Siapkan debug keystore bila belum ada
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kenali-tanaman.apk

      - name: Terbitkan APK untuk diunduh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete terbaru --yes --cleanup-tag || true
          gh release create terbaru kenali-tanaman.apk \
            --title "Kenali Tanaman (APK terbaru)" \
            --notes "Unduh kenali-tanaman.apk dari HP Android, lalu pasang."
